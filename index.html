<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slumber Inn - Virtual Assistant</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Markdown formatting styles inside bot bubbles */
        .bot-bubble strong { font-weight: 600; color: #0f172a; }
        .bot-bubble ul { list-style-type: disc; margin-left: 1.25rem; margin-top: 0.25rem; margin-bottom: 0.25rem; }
        .bot-bubble li { margin-bottom: 0.125rem; }
    </style>
</head>
<body class="bg-neutral-800 min-h-screen flex items-center justify-center p-4">

    <!-- Floating Chat Widget Container -->
    <div id="chat-widget" class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-100 flex flex-col h-[640px] transition-all duration-300">
        
        <!-- Chat Header -->
        <div class="bg-neutral-900 text-white px-5 py-4 flex items-center justify-between border-b border-neutral-800">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-xl bg-blue-700 flex items-center justify-center font-bold text-lg shadow-inner text-white">
                        SI
                    </div>
                    <!-- Online Status Badge -->
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-neutral-900 rounded-full"></span>
                </div>
                <div>
                    <h2 class="font-semibold text-base tracking-tight leading-tight">Slumber Inn</h2>
                    <p class="text-xs text-white font-medium">Virtual Assistant <span class="text-emerald-500 mx-0.5">•</span> <span class="text-emerald-500">Online</span></p>
                </div>
            </div>
            <div class="flex items-center space-x-2 text-slate-400">
                <button id="minimize-btn" title="Minimize" class="w-8 h-8 rounded-lg hover:bg-neutral-800 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-ellipsis text-sm"></i>
                </button>
                <button id="close-btn" title="Minimize Widget" class="w-8 h-8 rounded-lg hover:bg-neutral-800 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-chevron-down text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Quick Action Suggestions Bar -->
        <div class="bg-slate-50 px-4 py-2 border-b border-slate-100 flex items-center space-x-2 overflow-x-auto no-scrollbar whitespace-nowrap text-xs">
            <span class="text-slate-400 font-medium mr-1"><i class="fa-solid fa-bolt text-amber-500 mr-1"></i>FAQ</span>
            <button onclick="sendQuickPrompt('What time is check in?')" class="bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-300 text-slate-700 px-3 py-1 rounded-full transition-all shadow-sm">Check-in time</button>
            <button onclick="sendQuickPrompt('Is a king suite available next weekend?')" class="bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-300 text-slate-700 px-3 py-1 rounded-full transition-all shadow-sm">Room Availability</button>
            <button onclick="sendQuickPrompt('What is your pet policy?')" class="bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-300 text-slate-700 px-3 py-1 rounded-full transition-all shadow-sm">Pet Policy</button>
        </div>

        <!-- Chat Messages Body -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll bg-gradient-to-b from-slate-50/50 to-white">
            <!-- Initial Greeting from Assistant -->
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 rounded-full bg-blue-700 text-white flex-shrink-0 flex items-center justify-center text-xs font-bold shadow-sm">
                    SI
                </div>
                <div class="flex flex-col space-y-1 max-w-[80%]">
                    <div class="bot-bubble bg-white border border-slate-100 text-slate-800 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm text-sm leading-relaxed">
                        Hello! Welcome to <strong>Slumber Inn</strong>. I am your virtual assistant. How can I help you with your upcoming stay today?
                    </div>
                    <span class="text-[10px] text-slate-400 ml-1">Just now</span>
                </div>
            </div>
        </div>

        <!-- Typing Indicator (Hidden by default) -->
        <div id="typing-indicator" class="hidden px-4 py-2 bg-slate-50 border-t border-slate-100 flex items-center space-x-2 text-slate-500 text-xs">
            <div class="w-6 h-6 rounded-full bg-blue-700 text-white flex items-center justify-center text-[10px]">SI</div>
            <div class="flex space-x-1 items-center bg-white border border-slate-200 px-3 py-2 rounded-xl shadow-sm">
                <div class="w-1.5 h-1.5 bg-blue-600 rounded-full animate-bounce"></div>
                <div class="w-1.5 h-1.5 bg-blue-600 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                <div class="w-1.5 h-1.5 bg-blue-600 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                <span class="ml-1 text-slate-400">Slumber Assistant is typing...</span>
            </div>
        </div>

        <!-- Chat Input Footer -->
        <div class="p-3 bg-white border-t border-slate-100 flex items-center space-x-2">
            <button title="Attach file or booking reference" class="text-slate-400 hover:text-slate-600 p-2.5 rounded-xl hover:bg-slate-100 transition-colors flex-shrink-0">
                <i class="fa-solid fa-paperclip text-base"></i>
            </button>
            <input 
                type="text" 
                id="user-input" 
                placeholder="Write a reply..." 
                class="flex-1 bg-slate-100 border border-transparent focus:border-blue-600 focus:bg-white text-slate-800 placeholder-slate-400 text-sm rounded-xl px-4 py-3 focus:outline-none transition-all shadow-inner"
            >
            <button 
                id="send-btn" 
                class="bg-blue-600 hover:bg-blue-700 text-white w-11 h-11 rounded-xl flex items-center justify-center transition-all shadow-md hover:shadow-blue-600/20 flex-shrink-0"
            >
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Unique Conversation ID generator stored in localStorage
        function getConversationId() {
            let cid = localStorage.getItem("slumber_conv_id");
            if (!cid) {
                cid = "sess_" + Math.random().toString(36).substring(2, 11);
                localStorage.setItem("slumber_conv_id", cid);
            }
            return cid;
        }

        const conversationId = getConversationId();
        const chatMessages = document.getElementById("chat-messages");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const typingIndicator = document.getElementById("typing-indicator");

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function appendUserMessage(text) {
            const timeStr = getCurrentTime();
            const html = `
                <div class="flex items-start justify-end space-x-3">
                    <div class="flex flex-col space-y-1 max-w-[80%] items-end">
                        <div class="bg-blue-600 text-white px-4 py-3 rounded-2xl rounded-tr-sm shadow-sm text-sm leading-relaxed">
                            ${escapeHtml(text)}
                        </div>
                        <span class="text-[10px] text-slate-400 mr-1">${timeStr}</span>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-emerald-600 text-white flex-shrink-0 flex items-center justify-center text-xs font-bold shadow-sm">
                        <i class="fa-solid fa-user text-xs"></i>
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function createAssistantBubble() {
            const timeStr = getCurrentTime();
            const bubbleId = 'bot-msg-' + Date.now();
            const html = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-blue-700 text-white flex-shrink-0 flex items-center justify-center text-xs font-bold shadow-sm">
                        SI
                    </div>
                    <div class="flex flex-col space-y-1 max-w-[80%]">
                        <div id="${bubbleId}" class="bot-bubble bg-white border border-slate-100 text-slate-800 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm text-sm leading-relaxed"></div>
                        <span class="text-[10px] text-slate-400 ml-1">${timeStr}</span>
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
            return document.getElementById(bubbleId);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function handleSendMessage(messageText) {
            const text = messageText || userInput.value.trim();
            if (!text) return;

            userInput.value = "";
            appendUserMessage(text);
            typingIndicator.classList.remove("hidden");
            scrollToBottom();

            const botBubble = createAssistantBubble();
            let accumulatedReply = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        conversation_id: conversationId,
                        user_message: text
                    })
                });

               if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                typingIndicator.classList.add("hidden");

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    accumulatedReply += chunk;
                    botBubble.innerHTML = parseMarkdown(accumulatedReply);
                    scrollToBottom();
                }

            } catch (error) {
                typingIndicator.classList.add("hidden");
                botBubble.textContent = "\n[Connection Error: Unable to reach Slumber Inn backend service.]";
                botBubble.classList.add("text-rose-600");
                console.error("Chat error:", error);
            }
        }

        function sendQuickPrompt(promptText) {
            handleSendMessage(promptText);
        }

        sendBtn.addEventListener("click", () => handleSendMessage());
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                handleSendMessage();
            }
        });

        // Widget minimization toggle demo
        const chatWidget = document.getElementById("chat-widget");
        let isMinimized = false;
        document.getElementById("close-btn").addEventListener("click", () => {
            isMinimized = !isMinimized;
            if (isMinimized) {
                chatWidget.style.height = "72px";
                chatWidget.style.overflow = "hidden";
            } else {
                chatWidget.style.height = "640px";
                chatWidget.style.overflow = "hidden";
            }
        });

        function parseMarkdown(text) {
            const escaped = escapeHtml(text);
            return escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }
    </script>
</body>
</html>
